<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Cover 1080x878</title>
<link rel="stylesheet" href="brand.css">
<style>
html,body{width:1080px;height:878px}
body{
  position:relative;
  background:
    radial-gradient(ellipse 70% 60% at 85% 15%,rgba(63,109,255,.26),transparent 70%),
    linear-gradient(180deg,var(--navy),var(--navy-950));
}
/* LINE overlays the profile picture and name on the lower part of the cover:
   keep text in the upper ~60% */
.bg-mark{position:absolute;right:-160px;top:60px;width:900px;opacity:.12}
.in{position:absolute;left:84px;right:84px;top:110px}
.logo{height:70px;width:auto;display:block}
.eyebrow{font-size:20px;letter-spacing:.24em;gap:18px;margin-top:64px}
.eyebrow::before{width:30px;height:5px;box-shadow:11px 7px 0 0 currentColor;margin-bottom:7px}
h1{font-family:var(--display);font-weight:700;font-size:78px;line-height:1.12;margin-top:18px}
h1 .hl{background:linear-gradient(90deg,#fff,var(--blue-soft) 60%,var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.tags{display:flex;gap:14px;margin-top:34px}
.tags span{
  font-size:24px;font-weight:600;color:var(--silver);
  background:rgba(30,53,87,.7);padding:10px 30px 12px;
  clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);
}
.foot{position:absolute;left:0;right:0;bottom:0;height:10px}
.foot .streak{height:100%;width:100%;opacity:.25}
</style>
</head>
<body>
<svg class="bg-mark" viewBox="40 195 432 122">
  <defs>
    <linearGradient id="fA" x1="47" x2="330" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff"/><stop offset=".48" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="fB" x1="212" x2="468" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <path fill="#fff" d="M47 228 77 202H262L241 217H465L452 228Z"/>
  <path fill="url(#fA)" d="M47 297 78 276H330V297Z"/>
  <path fill="url(#fB)" d="M212 310 232 297H322L340 286H468V310Z"/>
</svg>
<div class="in">
  <img class="logo" src="../../logo-white.png" alt="">
  <p class="eyebrow">Enterprise IT procurement</p>
  <h1>ของแท้ ครบทุกพอร์ต<br><span class="hl">เสนอราคาใน 24 ชั่วโมง</span></h1>
  <div class="tags">
    <span>ใบกำกับภาษีเต็มรูป</span><span>เครดิต 30 วัน</span><span>ประกันศูนย์ไทย</span>
  </div>
</div>
<div class="foot"><span class="streak"></span></div>
</body>
</html>
